<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>文本工具箱</title>
<link rel="stylesheet" href="../common.css">
<style>
.cmp-app{display:flex;flex-direction:column;height:100vh}
.cmp-tabs{display:flex;gap:4px;padding:6px 10px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0}
.cmp-tab{height:30px;padding:0 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-primary);font-size:13px;cursor:pointer;font-family:inherit}
.cmp-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cmp-pane{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
.cmp-pane[hidden]{display:none}
/* 编解码/哈希（原 text-encoder） */
.p-app{display:flex;flex-direction:column;height:100%}
.p-toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.p-btn{height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-primary);font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.p-btn:hover{background:var(--bg-hover)}
.p-btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.p-btn-primary:hover{background:var(--accent-hover)}
.p-select{height:28px;padding:0 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-primary);font-size:12px;outline:none;cursor:pointer;min-width:130px}
.p-spacer{flex:1}
.p-body{display:flex;flex:1;min-height:0;gap:1px}
.p-pane{display:flex;flex-direction:column;flex:1;min-width:0;background:var(--bg-secondary)}
.p-pane-header{padding:6px 10px;flex-shrink:0;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;background:var(--bg-secondary);border-bottom:1px solid var(--border)}
.p-textarea{flex:1;resize:none;padding:10px;border:none;outline:none;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-mono);font-size:13px;line-height:1.5;tab-size:2}
.p-textarea::placeholder{color:var(--text-placeholder)}.p-textarea-input:focus{background:var(--bg-tertiary)}.p-textarea-output{background:var(--bg-tertiary)}
.p-statusbar{padding:4px 10px;font-size:11px;color:var(--text-muted);background:var(--bg-secondary);border-top:1px solid var(--border);flex-shrink:0;min-height:24px}
.p-image-preview{flex:1;display:none;flex-direction:column;min-height:0;background:var(--bg-tertiary)}
.p-image-info{padding:6px 12px;font-size:11px;color:var(--text-muted);background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;flex-wrap:wrap;gap:14px}
.p-image-info b{color:var(--accent);font-weight:500}
.p-image-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0;overflow:auto;background:var(--bg-tertiary)}
.p-image-wrap img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.p-image-actions{display:flex;gap:6px;padding:8px 10px;background:var(--bg-secondary);border-top:1px solid var(--border);flex-shrink:0}
/* 命名转换（原 case-converter，.cc- 前缀避免与 .p- 冲突） */
.cc-app{display:flex;flex-direction:column;height:100%;padding:10px;gap:8px}
.cc-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.cc-input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-primary);font-family:var(--font-mono);font-size:14px;outline:none;transition:border-color .15s}
.cc-input:focus{border-color:var(--accent)}.cc-input::placeholder{color:var(--text-placeholder)}
.cc-results{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;padding:4px 0}
.cc-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--radius-sm);background:var(--bg-secondary);min-height:32px;transition:background .1s}
.cc-row:hover{background:var(--bg-hover)}
.cc-row-label{font-size:12px;color:var(--text-muted,#888);min-width:100px;flex-shrink:0;font-family:var(--font-mono)}
.cc-row-value{font-size:13px;color:var(--text-primary);font-family:var(--font-mono);word-break:break-all}
.cc-row-active .cc-row-label{color:var(--accent)}
.cc-row-active .cc-row-value{color:#fff;font-weight:500}
.cc-badge{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--accent);color:#fff;margin-left:auto;flex-shrink:0}
.cc-empty{display:flex;align-items:center;justify-content:center;flex:1;color:var(--text-muted,#888);font-size:13px}
</style>
</head>
<body>
<div class="cmp-app">
  <div class="cmp-tabs">
    <button class="cmp-tab" data-tab="codec" id="tabCodec">🔤 编解码 / 哈希</button>
    <button class="cmp-tab" data-tab="case" id="tabCase">🔡 命名转换</button>
  </div>

  <!-- 编解码 / 哈希 -->
  <div class="cmp-pane" id="paneCodec">
  <div class="p-app">
    <div class="p-toolbar">
      <select class="p-select" id="opSelect">
        <option value="base64-encode">Base64 编码</option>
        <option value="base64-decode">Base64 解码</option>
        <option value="url-encode">URL 编码</option>
        <option value="url-decode">URL 解码</option>
        <option value="html-encode">HTML 编码</option>
        <option value="html-decode">HTML 解码</option>
        <option value="md5-hash">MD5 哈希</option>
        <option value="sha256-hash">SHA256 哈希</option>
      </select>
      <button class="p-btn p-btn-primary" id="btnProcess">▶ 执行</button>
      <button class="p-btn" id="btnCopy">📋 复制</button>
      <span class="p-spacer"></span>
      <button class="p-btn" id="btnClear">✕ 清空</button>
    </div>
    <div class="p-body">
      <div class="p-pane">
        <div class="p-pane-header">输入</div>
        <textarea id="inputArea" class="p-textarea p-textarea-input" placeholder="请输入要处理的文本…" spellcheck="false"></textarea>
      </div>
      <div class="p-pane">
        <div class="p-pane-header">输出</div>
        <textarea id="outputArea" class="p-textarea p-textarea-output" readonly placeholder="结果…" spellcheck="false"></textarea>
        <div id="imagePreview" class="p-image-preview">
          <div class="p-image-info" id="imageInfo"></div>
          <div class="p-image-wrap"><img id="previewImg" alt="预览" /></div>
          <div class="p-image-actions">
            <button class="p-btn" id="btnDownload">💾 下载图片</button>
            <button class="p-btn" id="btnCopyDataUri">📋 复制 Data URI</button>
          </div>
        </div>
      </div>
    </div>
    <div class="p-statusbar" id="statusBar">等待输入…</div>
  </div>
  </div>

  <!-- 命名转换 -->
  <div class="cmp-pane" id="paneCase" hidden>
    <div class="cc-app">
      <div class="cc-label">输入变量名</div>
      <input type="text" id="ccInput" class="cc-input" placeholder="例如: user_name 或 userName" spellcheck="false" autofocus>
      <div class="cc-label" style="margin-top:4px">所有命名风格</div>
      <div class="cc-results" id="ccResults"></div>
    </div>
  </div>
</div>

<!-- tab 切换（必须早于下方 codec/case 脚本，供其 plugin:init 调用） -->
<script>
(function(){
  var tabCodec=document.getElementById('tabCodec'),tabCase=document.getElementById('tabCase')
  var paneCodec=document.getElementById('paneCodec'),paneCase=document.getElementById('paneCase')
  function showTextTab(which){
    if(which==='case'){tabCase.classList.add('active');tabCodec.classList.remove('active');paneCase.hidden=false;paneCodec.hidden=true}
    else{tabCodec.classList.add('active');tabCase.classList.remove('active');paneCodec.hidden=false;paneCase.hidden=true}
  }
  tabCodec.addEventListener('click',function(){showTextTab('codec')})
  tabCase.addEventListener('click',function(){showTextTab('case')})
  window.showTextTab=showTextTab
  showTextTab('codec')
})()
</script>

<!-- 编解码 / 哈希（原 text-encoder 逻辑，保持不变） -->
<script>
(function(){
  var inputArea=document.getElementById('inputArea'),outputArea=document.getElementById('outputArea')
  var opSelect=document.getElementById('opSelect'),btnProcess=document.getElementById('btnProcess')
  var btnCopy=document.getElementById('btnCopy'),btnClear=document.getElementById('btnClear'),statusText=document.getElementById('statusBar')
  var imagePreview=document.getElementById('imagePreview'),previewImg=document.getElementById('previewImg')
  var imageInfo=document.getElementById('imageInfo'),btnDownload=document.getElementById('btnDownload')
  var btnCopyDataUri=document.getElementById('btnCopyDataUri')
  var currentMime='',currentDataUri=''

  var reqSeq=0
  var pending={}

  function detectImageFromBase64(b64){
    if(b64.substr(0,6).toUpperCase()==='PHN2ZW')return 'image/svg+xml'
    try{
      var bin=atob(b64.substr(0,24))
      var b=[]
      for(var i=0;i<bin.length;i++)b.push(bin.charCodeAt(i)&0xFF)
      if(b[0]===0x89&&b[1]===0x50&&b[2]===0x4E&&b[3]===0x47)return 'image/png'
      if(b[0]===0xFF&&b[1]===0xD8&&b[2]===0xFF)return 'image/jpeg'
      if(b[0]===0x47&&b[1]===0x49&&b[2]===0x46&&b[3]===0x38)return 'image/gif'
      if(b[0]===0x42&&b[1]===0x4D)return 'image/bmp'
      if(b[0]===0x52&&b[1]===0x49&&b[2]===0x46&&b[3]===0x46&&b.length>11&&b[8]===0x57&&b[9]===0x45&&b[10]===0x42&&b[11]===0x50)return 'image/webp'
      if(b[0]===0x00&&b[1]===0x00&&(b[2]===0x01||b[2]===0x02)&&b[3]===0x00)return 'image/x-icon'
    }catch(e){}
    return null
  }

  function tryExtractImage(text){
    var m=text.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,([\s\S]+)/i)
    if(m)return {mime:m[1].toLowerCase(), base64:m[2].replace(/\s/g,'')}
    var clean=text.replace(/\s/g,'')
    if(!/^[A-Za-z0-9+/]*={0,2}$/.test(clean)||clean.length<16)return null
    var mime=detectImageFromBase64(clean)
    if(mime)return {mime:mime, base64:clean}
    return null
  }

  function formatSize(bytes){
    if(bytes<1024)return bytes+' B'
    if(bytes<1048576)return (bytes/1024).toFixed(1)+' KB'
    return (bytes/1048576).toFixed(2)+' MB'
  }

  function mimeToExt(mime){
    var ext=mime.split('/')[1]
    if(ext==='jpeg')return 'jpg'
    if(ext==='svg+xml')return 'svg'
    if(ext==='x-icon')return 'ico'
    return ext
  }

  function showImagePreview(dataUri,mime,base64Str){
    outputArea.style.display='none'
    imagePreview.style.display='flex'
    previewImg.src=dataUri
    var pad=(base64Str.match(/=+$/)||[''])[0].length
    var sizeBytes=Math.floor(base64Str.length*3/4)-pad
    imageInfo.innerHTML='<span>类型: <b>'+mime+'</b></span><span>大小: <b>'+formatSize(sizeBytes)+'</b></span><span id="dimInfo">尺寸: <b>加载中…</b></span>'
    currentMime=mime;currentDataUri=dataUri
    statusText.textContent='🖼️ 检测到 Base64 图片 | '+mime+' | '+formatSize(sizeBytes)
  }

  function hideImagePreview(){
    if(imagePreview.style.display!=='none'){
      outputArea.style.display=''
      imagePreview.style.display='none'
      previewImg.src=''
    }
  }

  previewImg.addEventListener('load',function(){
    var dim=document.getElementById('dimInfo')
    if(dim)dim.innerHTML='尺寸: <b>'+previewImg.naturalWidth+' × '+previewImg.naturalHeight+'</b>'
  })

  btnDownload.addEventListener('click',function(){
    if(!currentDataUri)return
    var a=document.createElement('a')
    a.href=currentDataUri
    a.download='image_'+Date.now()+'.'+mimeToExt(currentMime)
    document.body.appendChild(a);a.click();a.remove()
    statusText.textContent='💾 已触发下载'
  })

  btnCopyDataUri.addEventListener('click',function(){
    if(!currentDataUri)return
    pluginCopy(currentDataUri).then(function(ok){statusText.textContent=ok?'📋 已复制 Data URI！':'❌ 复制失败'})
  })

  function pluginExec(command, input){
    return new Promise(function(resolve, reject){
      var id='te_'+(++reqSeq)
      pending[id]={resolve:resolve, reject:reject}
      parent.postMessage({type:'plugin:execute', id:id, command:command, input:input}, '*')
    })
  }

  window.addEventListener('message', function(e){
    var d=e&&e.data
    if(!d||d.type!=='plugin:result'||!d.id) return
    var p=pending[d.id]
    if(!p) return
    delete pending[d.id]
    if(d.error) p.reject(new Error(d.error))
    else p.resolve(d.data)
  })

  function pluginCopy(text){
    return new Promise(function(resolve){
      var id='cp_'+(++reqSeq)
      var done=false
      function onMsg(e){var d=e&&e.data;if(!d||d.type!=='plugin:copy-result'||d.id!==id)return;done=true;window.removeEventListener('message',onMsg);resolve(!!d.ok)}
      window.addEventListener('message',onMsg)
      parent.postMessage({type:'plugin:copy', id:id, text:text}, '*')
      setTimeout(function(){if(!done){window.removeEventListener('message',onMsg);fallbackCopy(text).then(resolve)}},300)
    })
  }
  function fallbackCopy(text){
    return new Promise(function(resolve){
      try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){resolve(true)}).catch(function(){resolve(execCopy(text))});return} }catch(e){}
      resolve(execCopy(text))
    })
  }
  function execCopy(text){
    try{var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';ta.style.top='0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);return ok}catch(e){return false}
  }
  btnProcess.addEventListener('click', process)
  btnCopy.addEventListener('click',function(){if(outputArea.value){pluginCopy(outputArea.value).then(function(ok){statusText.textContent=ok?'已复制！':'❌ 复制失败'})}})
  btnClear.addEventListener('click',function(){inputArea.value='';outputArea.value='';hideImagePreview();statusText.textContent='等待输入…';inputArea.focus()})
  document.addEventListener('keydown',function(e){if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();process()};if(e.key==='Escape'&&!paneCodec.hidden)inputArea.focus()})
  var autoTimer;inputArea.addEventListener('input',function(){if(autoTimer)clearTimeout(autoTimer);if(inputArea.value.trim())autoTimer=setTimeout(process,500);else{outputArea.value='';hideImagePreview();statusText.textContent='等待输入…'}})
  opSelect.addEventListener('change',function(){hideImagePreview();if(inputArea.value.trim())process()})

  window.addEventListener('message',function(e){
    var d=e&&e.data
    if(!d||d.type!=='plugin:init'||!d.data)return
    var pd=d.data
    if(pd.command){
      for(var i=0;i<opSelect.options.length;i++){
        if(opSelect.options[i].value===pd.command){opSelect.selectedIndex=i;break}
      }
      if(window.showTextTab)window.showTextTab(pd.command==='convert-case'?'case':'codec')
    }
    if(pd.text){
      inputArea.value=pd.text
      process()
      try{outputArea.focus();outputArea.select()}catch(_){}
    }
  })

  function process(){
    var text=inputArea.value.trim()
    if(!text){outputArea.value='';hideImagePreview();statusText.textContent='等待输入…';return}
    var op=opSelect.value

    if(op==='base64-decode'){
      var img=tryExtractImage(text)
      if(img){
        var pad=img.base64.length%4
        if(pad)img.base64+='===='.substring(0,4-pad)
        showImagePreview('data:'+img.mime+';base64,'+img.base64, img.mime, img.base64)
        return
      }
    }

    hideImagePreview()
    statusText.textContent='计算中…'
    pluginExec(op, {text:text}).then(function(res){
      var r = (res && typeof res==='object' && res.text!==undefined) ? res.text : (typeof res==='string'?res:'')
      outputArea.value=r
      statusText.textContent='✅ '+(opSelect.options[opSelect.selectedIndex].text)+' | '+r.length+' 字符'
    }).catch(function(err){
      outputArea.value=''
      statusText.textContent='❌ 错误: '+(err&&err.message?err.message:err)
    })
  }
  inputArea.focus()
})()
</script>

<!-- 命名转换（原 case-converter 逻辑，.cc- 前缀避免样式冲突） -->
<script>
(function(){
  var ccInput=document.getElementById('ccInput'), ccResults=document.getElementById('ccResults')
  ccInput.addEventListener('input',convert)
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!document.getElementById('paneCase').hidden)ccInput.focus()})
  window.addEventListener('message',function(e){
    var d=e&&e.data
    if(!d||d.type!=='plugin:init'||!d.data)return
    var pd=d.data
    if(pd.command==='convert-case'&&pd.text){ccInput.value=pd.text;convert();try{ccInput.focus();ccInput.select()}catch(_){}}
  })
  function convert(){
    var text=ccInput.value.trim()
    if(!text){ccResults.innerHTML='<div class="cc-empty">输入变量名自动转换</div>';return}
    text=text.replace(/^['"`]|['"`]$/g,'')
    var words=tokenize(text)
    if(!words||words.length===0){ccResults.innerHTML='<div class="cc-empty">无法识别命名风格</div>';return}
    var items=[
      {label:'camelCase',value:toCamel(words)},
      {label:'PascalCase',value:toPascal(words)},
      {label:'snake_case',value:toSnake(words)},
      {label:'kebab-case',value:toKebab(words)},
      {label:'UPPER_CASE',value:toUpper(words)},
      {label:'camel_Snake',value:toCamelSnake(words)},
      {label:'Train-Case',value:toTrain(words)},
      {label:'dot.case',value:toDot(words)}
    ]
    var detected=detectStyle(text)
    var html=''
    for(var i=0;i<items.length;i++){
      var isActive=detectStyle(items[i].value)===detected
      html+='<div class="cc-row'+(isActive?' cc-row-active':'')+'">'+
        '<span class="cc-row-label">'+items[i].label+'</span>'+
        '<span class="cc-row-value">'+esc(items[i].value)+'</span>'+
        (isActive?'<span class="cc-badge">原始</span>':'')+'</div>'
    }
    ccResults.innerHTML=html
  }
  function tokenize(str){
    if(/[_-]/.test(str)) return str.split(/[_-]+/).filter(function(w){return w.length>0}).map(function(w){return w.toLowerCase()})
    var parts=[],buf=''
    for(var i=0;i<str.length;i++){
      var ch=str[i]
      if(ch>='A'&&ch<='Z'){
        if(buf.length>0){parts.push(buf.toLowerCase());buf=''}
        var j=i;while(j<str.length&&str[j]>='A'&&str[j]<='Z')j++
        if(j-i>1&&j<str.length){parts.push(str.substring(i,j-1).toLowerCase());i=j-2;continue}
        buf=ch
      }else if(ch==='-'||ch==='_'){if(buf.length>0){parts.push(buf.toLowerCase());buf=''}}
      else{buf+=ch}
    }
    if(buf.length>0)parts.push(buf.toLowerCase())
    return parts
  }
  function toCamel(w){var s=w[0];for(var i=1;i<w.length;i++)s+=w[i].charAt(0).toUpperCase()+w[i].slice(1);return s}
  function toPascal(w){var s='';for(var i=0;i<w.length;i++)s+=w[i].charAt(0).toUpperCase()+w[i].slice(1);return s}
  function toSnake(w){return w.join('_')}
  function toKebab(w){return w.join('-')}
  function toUpper(w){var s='';for(var i=0;i<w.length;i++){if(i>0)s+='_';s+=w[i].toUpperCase()}return s}
  function toCamelSnake(w){var s=w[0];for(var i=1;i<w.length;i++)s+='_'+w[i].charAt(0).toUpperCase()+w[i].slice(1);return s}
  function toTrain(w){var s='';for(var i=0;i<w.length;i++){if(i>0)s+='-';s+=w[i].charAt(0).toUpperCase()+w[i].slice(1)}return s}
  function toDot(w){return w.join('.')}
  function detectStyle(str){
    if(/^[a-z]+_[a-z]+/.test(str)) return 'snake_case'
    if(/^[a-z]+-[a-z]+/.test(str)) return 'kebab-case'
    if(/^[A-Z]+_[A-Z]+/.test(str)) return 'UPPER_CASE'
    if(/^[a-z]+[A-Z]/.test(str)) return 'camelCase'
    if(/^[A-Z][a-z]+[A-Z]/.test(str)) return 'PascalCase'
    if(/^[A-Z][a-z]+-[A-Z]/.test(str)) return 'Train-Case'
    return ''
  }
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
})()
</script>
</body>
</html>
