<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>对比工具</title>
<link rel="stylesheet" href="../common.css">
<style>
.cmp-app{display:flex;flex-direction:column;height:100vh}
.cmp-tabs{display:flex;gap:4px;padding:6px 10px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0}
.cmp-tab{height:30px;padding:0 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-primary);font-size:13px;cursor:pointer;font-family:inherit}
.cmp-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cmp-pane{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
.cmp-pane[hidden]{display:none}
/* 文件对比 */
.fc-zones{display:flex;gap:10px;padding:12px;flex-shrink:0}
.fc-zone{flex:1;min-height:120px;border:1.5px dashed var(--border);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;background:var(--bg-secondary);transition:border-color .15s,background .15s;padding:8px}
.fc-zone.drag-over{border-color:var(--accent);background:var(--bg-tertiary)}
.fc-zone.has-file{border-style:solid}
.fc-drop-hint{text-align:center;color:var(--text-muted)}
.fc-icon{font-size:26px}
.fc-text{font-size:13px;margin-top:4px}
.fc-sub{font-size:11px;opacity:.7}
.fc-file-info{width:100%;font-size:12px}
.fc-file-row{display:flex;gap:8px;padding:2px 0}
.fc-file-label{color:var(--text-muted);min-width:64px;flex-shrink:0}
.fc-file-value{word-break:break-all}
.fc-img{margin-top:8px;max-width:100%;max-height:140px;border-radius:4px;box-shadow:0 1px 8px rgba(0,0,0,.35)}
.fc-clear-btn{position:absolute;top:4px;right:6px;height:20px;width:20px;border:none;border-radius:50%;background:var(--bg-hover);color:var(--text-muted);cursor:pointer;font-size:11px;line-height:1}
.fc-clear-btn:hover{color:var(--text-primary)}
.fc-result{padding:0 12px 12px}
.fc-section-h{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px}
.fc-diff-item{display:flex;gap:8px;padding:3px 6px;border-radius:var(--radius-sm);background:var(--bg-secondary);margin-bottom:3px;font-size:12px}
.fc-diff-label{color:var(--text-muted);min-width:64px;flex-shrink:0}
.fc-diff-value.fc-diff-mismatch{color:#e24b4a}
.fc-diff-value.fc-diff-match{color:var(--text-primary)}
.fc-empty{color:var(--text-muted);font-size:12px;padding:8px 0}
/* 文本 Diff */
.td-toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.td-btn{height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-primary);font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.td-btn:hover{background:var(--bg-hover)}
.td-btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.td-btn-primary:hover{background:var(--accent-hover)}
.td-opt{font-size:12px;color:var(--text-muted)}
.td-sep{width:1px;height:18px;background:var(--border)}
.td-spacer{flex:1}
.td-stats{font-size:11px;color:var(--text-muted)}
.td-editors{display:flex;flex:1;min-height:0}
.td-pane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-secondary)}
.td-pane-header{padding:6px 10px;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);display:flex;gap:8px}
.td-textarea{flex:1;resize:none;padding:10px;border:none;outline:none;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-mono);font-size:13px;line-height:1.5;tab-size:2}
.td-result{flex:1;min-height:0;display:none;flex-direction:column;background:var(--bg-secondary)}
.td-result-header{padding:6px 10px;font-size:11px;color:var(--text-muted);border-bottom:1px solid var(--border);flex-shrink:0}
.td-diff-output{flex:1;overflow:auto;font-family:var(--font-mono);font-size:12px;line-height:1.5;padding:4px 0}
.diff-line{display:flex;white-space:pre-wrap;padding:0 8px}
.diff-linenum{width:34px;color:var(--text-muted);text-align:right;padding-right:6px;user-select:none;flex-shrink:0}
.diff-marker{width:14px;flex-shrink:0;text-align:center}
.diff-eq{color:var(--text-primary)}
.diff-add{background:rgba(40,200,100,.12)}
.diff-del{background:rgba(226,75,74,.12)}
.diff-mod{background:rgba(240,180,40,.12)}
.diff-char-add{color:#28c864}
.diff-char-del{color:#e24b4a}
</style>
</head>
<body>
<div class="cmp-app">
  <div class="cmp-tabs">
    <button class="cmp-tab" data-tab="file" id="tabFile">📁 文件对比</button>
    <button class="cmp-tab" data-tab="text" id="tabText">📝 文本对比</button>
  </div>

  <!-- 文件对比 -->
  <div class="cmp-pane" id="paneFile">
    <div class="fc-zones">
      <div class="fc-zone" id="fcZoneLeft" data-side="left">
        <div class="fc-drop-hint" id="fcHintLeft"><div class="fc-icon">📄</div><div class="fc-text">拖入第一个文件</div><div class="fc-sub">或点击选择</div></div>
        <div class="fc-file-info" id="fcInfoLeft" style="display:none"></div>
      </div>
      <div class="fc-zone" id="fcZoneRight" data-side="right">
        <div class="fc-drop-hint" id="fcHintRight"><div class="fc-icon">📄</div><div class="fc-text">拖入第二个文件</div><div class="fc-sub">或点击选择</div></div>
        <div class="fc-file-info" id="fcInfoRight" style="display:none"></div>
      </div>
    </div>
    <div class="fc-result" id="fcResult" style="display:none">
      <div class="fc-section-h">文件信息对比</div>
      <div id="fcMetaBody"></div>
      <div class="fc-content-diff" id="fcContentDiff" style="display:none">
        <div class="fc-section-h">文本内容差异（两侧均为文本时）</div>
        <div class="td-diff-output" id="fcDiffOutput"></div>
      </div>
    </div>
    <div class="fc-empty" id="fcEmpty" style="padding:12px">拖入两个文件即可对比名称 / 大小 / 类型 / 修改时间；若两侧都是文本，会自动给出内容差异。</div>
  </div>

  <!-- 文本对比 -->
  <div class="cmp-pane" id="paneText" hidden>
    <div class="td-toolbar">
      <button class="td-btn td-btn-primary" id="tdCompare">▶ 对比</button>
      <button class="td-btn" id="tdSwap">⇄ 交换</button>
      <button class="td-btn" id="tdClear">✕ 清空</button>
      <span class="td-sep"></span>
      <label class="td-opt"><input type="checkbox" id="tdIgnoreCase"> 忽略大小写</label>
      <label class="td-opt"><input type="checkbox" id="tdTrim"> 去除首尾空格</label>
      <span class="td-spacer"></span>
      <span id="tdStats" class="td-stats">差异: 0 行</span>
    </div>
    <div class="td-editors">
      <div class="td-pane"><div class="td-pane-header">原始文本 <span id="tdLeftLines">0 行</span></div><textarea id="tdLeft" class="td-textarea" placeholder="在此粘贴原始文本…" spellcheck="false"></textarea></div>
      <div class="td-pane"><div class="td-pane-header">新文本 <span id="tdRightLines">0 行</span></div><textarea id="tdRight" class="td-textarea" placeholder="在此粘贴新文本…" spellcheck="false"></textarea></div>
    </div>
    <div class="td-result" id="tdResult">
      <div class="td-result-header">对比结果 <span id="tdResultStats"></span></div>
      <div class="td-diff-output" id="tdDiffOutput"></div>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict'
  function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function formatSize(bytes){if(bytes===0)return '0 B';var u=['B','KB','MB','GB'],i=0,s=bytes;while(s>=1024&&i<u.length-1){s/=1024;i++}return (i===0?s:s.toFixed(1))+' '+u[i]}
  function getExtension(n){var i=n.lastIndexOf('.');return i>=0?n.substring(i+1).toLowerCase():''}
  function compareRow(label,lv,rv,isDiff){var c=isDiff?'fc-diff-mismatch':'fc-diff-match';var ic=isDiff?'✗':'✓';return '<div class="fc-diff-item"><span class="fc-diff-label">'+escapeHtml(label)+'</span><span class="fc-diff-value '+c+'">'+escapeHtml(lv)+'  →  '+escapeHtml(rv)+'  '+ic+'</span></div>'}

  // ===== 文本 Diff 引擎（复用 text-diff 的 LCS 算法，参数化渲染）=====
  var tdIgnoreCase=document.getElementById('tdIgnoreCase'),tdTrim=document.getElementById('tdTrim')
  function computeLCS(a,b){
    var o=a.length,n=b.length,dp=[]
    for(var i=0;i<=o;i++){dp[i]=[];for(var j=0;j<=n;j++)dp[i][j]=0}
    for(var i2=1;i2<=o;i2++)for(var j2=1;j2<=n;j2++){
      var av=tdIgnoreCase.checked?a[i2-1].toLowerCase():a[i2-1]
      var bv=tdIgnoreCase.checked?b[j2-1].toLowerCase():b[j2-1]
      if(av===bv)dp[i2][j2]=dp[i2-1][j2-1]+1;else dp[i2][j2]=Math.max(dp[i2-1][j2],dp[i2][j2-1])
    }
    var res=[],oi=o,ni=n
    while(oi>0||ni>0){
      if(oi>0&&ni>0){
        var av2=tdIgnoreCase.checked?a[oi-1].toLowerCase():a[oi-1]
        var bv2=tdIgnoreCase.checked?b[ni-1].toLowerCase():b[ni-1]
        if(av2===bv2){res.unshift({type:'eq',oi:oi-1,ni:ni-1});oi--;ni--;continue}
        if(dp[oi-1][ni]>=dp[oi][ni-1]){res.unshift({type:'del',oi:oi-1,ni:-1});oi--}else{res.unshift({type:'add',oi:-1,ni:ni-1});ni--}
      }else if(oi>0){res.unshift({type:'del',oi:oi-1,ni:-1});oi--}else{res.unshift({type:'add',oi:-1,ni:ni-1});ni--}
    }
    var merged=[]
    for(var k=0;k<res.length;k++){
      if(k+1<res.length&&res[k].type==='del'&&res[k+1].type==='add'){merged.push({type:'mod',oi:res[k].oi,ni:res[k+1].ni});k++}else merged.push(res[k])
    }
    return merged
  }
  function escCh(c){return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c}
  function charDiff(oldStr,newStr){
    if(oldStr===newStr)return escapeHtml(oldStr)
    var oc=oldStr.split(''),nc=newStr.split(''),lcs=charLCS(oc,nc),oh='',oi=0,li=0
    while(oi<oc.length){if(li<lcs.length&&lcs[li]===oc[oi]){oh+=escCh(oc[oi]);li++}else oh+='<span class="diff-char-del">'+escCh(oc[oi])+'</span>';oi++}
    var nh='',ni=0;li=0
    while(ni<nc.length){if(li<lcs.length&&lcs[li]===nc[ni]){nh+=escCh(nc[ni]);li++}else nh+='<span class="diff-char-add">'+escCh(nc[ni])+'</span>';ni++}
    return '<span class="diff-old">'+oh+'</span> → <span class="diff-new">'+nh+'</span>'
  }
  function charLCS(a,b){var m=a.length,n=b.length,dp=[];for(var i=0;i<=m;i++){dp[i]=[];for(var j=0;j<=n;j++)dp[i][j]=0}for(var i2=1;i2<=m;i2++)for(var j2=1;j2<=n;j2++){if(a[i2-1]===b[j2-1])dp[i2][j2]=dp[i2-1][j2-1]+1;else dp[i2][j2]=Math.max(dp[i2-1][j2],dp[i2][j2-1])}var r=[],mi=m,ni=n;while(mi>0&&ni>0){if(a[mi-1]===b[ni-1]){r.unshift(a[mi-1]);mi--;ni--}else if(dp[mi-1][ni]>=dp[mi][ni-1])mi--;else ni--}return r}
  function renderDiff(diff,leftText,rightText,container){
    var lo=leftText.split('\n'),ro=rightText.split('\n'),html=''
    for(var i=0;i<diff.length;i++){
      var d=diff[i],cls,marker,display,on,nn
      if(d.type==='eq'){cls='diff-eq';marker=' ';display=escapeHtml(lo[d.oi]||'');on=d.oi+1;nn=d.ni+1}
      else if(d.type==='add'){cls='diff-add';marker='+';display=escapeHtml(ro[d.ni]||'');on='';nn=d.ni+1}
      else if(d.type==='del'){cls='diff-del';marker='-';display=escapeHtml(lo[d.oi]||'');on=d.oi+1;nn=''}
      else{cls='diff-mod';marker='~';display=charDiff(lo[d.oi]||'',ro[d.ni]||'');on=d.oi+1;nn=d.ni+1}
      html+='<div class="diff-line '+cls+'"><span class="diff-linenum">'+on+'</span><span class="diff-linenum">'+nn+'</span><span class="diff-marker">'+marker+'</span><span class="diff-text">'+display+'</span></div>'
    }
    container.innerHTML=html
  }

  // ===== 文本对比 tab =====
  var tdLeft=document.getElementById('tdLeft'),tdRight=document.getElementById('tdRight')
  var tdCompare=document.getElementById('tdCompare'),tdSwap=document.getElementById('tdSwap'),tdClear=document.getElementById('tdClear')
  var tdStats=document.getElementById('tdStats'),tdResult=document.getElementById('tdResult')
  var tdDiffOutput=document.getElementById('tdDiffOutput'),tdResultStats=document.getElementById('tdResultStats')
  var tdLeftLines=document.getElementById('tdLeftLines'),tdRightLines=document.getElementById('tdRightLines')
  function updateLineCounts(){tdLeftLines.textContent=(tdLeft.value.match(/\n/g)||[]).length+1+' 行';tdRightLines.textContent=(tdRight.value.match(/\n/g)||[]).length+1+' 行'}
  tdLeft.addEventListener('input',updateLineCounts);tdRight.addEventListener('input',updateLineCounts)
  tdCompare.addEventListener('click',doDiff)
  tdSwap.addEventListener('click',function(){var t=tdLeft.value;tdLeft.value=tdRight.value;tdRight.value=t;updateLineCounts();doDiff()})
  tdClear.addEventListener('click',function(){tdLeft.value='';tdRight.value='';tdResult.style.display='none';updateLineCounts();tdLeft.focus()})
  tdIgnoreCase.addEventListener('change',function(){if(tdLeft.value||tdRight.value)doDiff()})
  tdTrim.addEventListener('change',function(){if(tdLeft.value||tdRight.value)doDiff()})
  document.addEventListener('keydown',function(e){if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();doDiff()}if(e.key==='Escape'&&!paneText.hidden)tdLeft.focus()})
  function doDiff(){
    var oldText=tdLeft.value,newText=tdRight.value
    if(!oldText&&!newText){tdStats.textContent='差异: 0 行';tdResult.style.display='none';return}
    var oL=oldText.split('\n'),nL=newText.split('\n')
    if(tdTrim.checked){oL=oL.map(function(l){return l.trim()});nL=nL.map(function(l){return l.trim()})}
    var diff=computeLCS(oL,nL),stats={add:0,del:0,mod:0,eq:0}
    for(var i=0;i<diff.length;i++){if(diff[i].type==='add')stats.add++;else if(diff[i].type==='del')stats.del++;else if(diff[i].type==='mod')stats.mod++;else stats.eq++}
    renderDiff(diff,oldText,newText,tdDiffOutput)
    tdStats.textContent='差异: '+(stats.add+stats.del+stats.mod)+' 行'
    tdResultStats.textContent='新增 '+stats.add+'  |  删除 '+stats.del+'  |  修改 '+stats.mod+'  |  相同 '+stats.eq
    tdResult.style.display='flex'
  }

  // ===== 文件对比 tab =====
  var fcZoneLeft=document.getElementById('fcZoneLeft'),fcZoneRight=document.getElementById('fcZoneRight')
  var fcHintLeft=document.getElementById('fcHintLeft'),fcHintRight=document.getElementById('fcHintRight')
  var fcInfoLeft=document.getElementById('fcInfoLeft'),fcInfoRight=document.getElementById('fcInfoRight')
  var fcResult=document.getElementById('fcResult'),fcMetaBody=document.getElementById('fcMetaBody')
  var fcContentDiff=document.getElementById('fcContentDiff'),fcDiffOutput=document.getElementById('fcDiffOutput')
  var fcEmpty=document.getElementById('fcEmpty')
  var fcFile={left:null,right:null},fileInputs={}
  ;['left','right'].forEach(function(side){
    var inp=document.createElement('input');inp.type='file';inp.className='fc-file-input'
    inp.addEventListener('change',function(e){if(e.target.files.length>0)handleFile(side,e.target.files[0])})
    document.body.appendChild(inp);fileInputs[side]=inp
  })
  fcZoneLeft.addEventListener('click',function(){fileInputs.left.click()})
  fcZoneRight.addEventListener('click',function(){fileInputs.right.click()})
  ;['left','right'].forEach(function(side){var z=side==='left'?fcZoneLeft:fcZoneRight
    z.addEventListener('dragover',function(e){e.preventDefault();z.classList.add('drag-over')})
    z.addEventListener('dragleave',function(){z.classList.remove('drag-over')})
    z.addEventListener('drop',function(e){e.preventDefault();z.classList.remove('drag-over');if(e.dataTransfer.files.length>0)handleFile(side,e.dataTransfer.files[0])})
  })
  ;['left','right'].forEach(function(side){var z=side==='left'?fcZoneLeft:fcZoneRight
    var b=document.createElement('button');b.className='fc-clear-btn';b.textContent='✕';b.title='移除文件'
    b.addEventListener('click',function(e){e.stopPropagation();clearFile(side)});z.appendChild(b)
  })
  function handleFile(side,file){
    if(side==='left'){fcFile.left=file;renderFileInfo(file,fcInfoLeft,fcHintLeft,fcZoneLeft)}
    else{fcFile.right=file;renderFileInfo(file,fcInfoRight,fcHintRight,fcZoneRight)}
    if(fcFile.left&&fcFile.right)doCompare()
  }
  function clearFile(side){
    if(side==='left'){fcFile.left=null;fcInfoLeft.style.display='none';fcHintLeft.style.display='';fcZoneLeft.classList.remove('has-file')}
    else{fcFile.right=null;fcInfoRight.style.display='none';fcHintRight.style.display='';fcZoneRight.classList.remove('has-file')}
    fcResult.style.display='none';fcEmpty.style.display='';fileInputs[side].value=''
  }
  function renderFileInfo(file,infoEl,hintEl,zoneEl){
    hintEl.style.display='none';infoEl.style.display='';zoneEl.classList.add('has-file')
    var sizeStr=formatSize(file.size),typeStr=file.type||getExtension(file.name)||'未知',dateStr=file.lastModified?new Date(file.lastModified).toLocaleString():'未知'
    var html='<div class="fc-file-row"><span class="fc-file-label">文件名</span><span class="fc-file-value">'+escapeHtml(file.name)+'</span></div>'
      +'<div class="fc-file-row"><span class="fc-file-label">大小</span><span class="fc-file-value">'+sizeStr+'</span></div>'
      +'<div class="fc-file-row"><span class="fc-file-label">类型</span><span class="fc-file-value">'+escapeHtml(typeStr)+'</span></div>'
      +'<div class="fc-file-row"><span class="fc-file-label">修改日期</span><span class="fc-file-value">'+escapeHtml(dateStr)+'</span></div>'
    if(file.type&&file.type.indexOf('image/')===0){
      var r=new FileReader();r.onload=function(e){infoEl.innerHTML=html+'<img class="fc-img" src="'+e.target.result+'" alt="preview">'};r.readAsDataURL(file);return
    }
    infoEl.innerHTML=html
  }
  function isLikelyText(file){
    if(file.type&&file.type.indexOf('text/')===0)return true
    var ext=getExtension(file.name)
    var t={txt:1,json:1,js:1,ts:1,tsx:1,jsx:1,html:1,htm:1,css:1,scss:1,less:1,md:1,markdown:1,csv:1,xml:1,yaml:1,yml:1,go:1,py:1,java:1,c:1,cpp:1,h:1,rs:1,php:1,rb:1,sh:1,sql:1,log:1,ini:1,cfg:1,toml:1,lock:1,conf:1}
    return !!t[ext]
  }
  function doCompare(){
    var L=fcFile.left,R=fcFile.right,rows=[]
    rows.push(compareRow('文件名',L.name,R.name))
    rows.push(compareRow('大小',formatSize(L.size),formatSize(R.size),L.size!==R.size))
    var tl=L.type||getExtension(L.name)||'未知',tr=R.type||getExtension(R.name)||'未知'
    rows.push(compareRow('类型',tl,tr))
    var el=getExtension(L.name),er=getExtension(R.name)
    if(el&&er)rows.push(compareRow('扩展名',el,er))
    rows.push(compareRow('修改时间',new Date(L.lastModified).toLocaleString(),new Date(R.lastModified).toLocaleString(),L.lastModified!==R.lastModified))
    fcMetaBody.innerHTML=rows.join('')
    fcResult.style.display='';fcEmpty.style.display='none'
    if(isLikelyText(L)&&isLikelyText(R)){
      readBothText(L,R,function(lt,rt){
        if(lt===null||rt===null){fcContentDiff.style.display='none';return}
        var diff=computeLCS(lt.split('\n'),rt.split('\n'))
        renderDiff(diff,lt,rt,fcDiffOutput)
        fcContentDiff.style.display=''
      })
    }else fcContentDiff.style.display='none'
  }
  function readBothText(L,R,cb){
    var done=0,res={l:null,r:null}
    function read(f,key){var r=new FileReader();r.onload=function(e){res[key]=e.target.result;if(++done===2)cb(res.l,res.r)};r.onerror=function(){res[key]=null;if(++done===2)cb(res.l,res.r)};r.readAsText(f)}
    read(L,'l');read(R,'r')
  }

  // ===== tab 切换 =====
  var tabFile=document.getElementById('tabFile'),tabText=document.getElementById('tabText')
  var paneFile=document.getElementById('paneFile'),paneText=document.getElementById('paneText')
  function showTab(which){
    if(which==='file'){tabFile.classList.add('active');tabText.classList.remove('active');paneFile.hidden=false;paneText.hidden=true}
    else{tabText.classList.add('active');tabFile.classList.remove('active');paneText.hidden=false;paneFile.hidden=true;updateLineCounts()}
  }
  tabFile.addEventListener('click',function(){showTab('file')})
  tabText.addEventListener('click',function(){showTab('text')})
  window.showCompareTab=showTab

  // 命令面板带参打开：按命令选择默认 tab
  window.addEventListener('message',function(e){
    var d=e&&e.data
    if(!d||d.type!=='plugin:init'||!d.data)return
    var cmd=d.data.command||''
    showTab(cmd==='open-diff'?'text':'file')
  })

  updateLineCounts()
})()
