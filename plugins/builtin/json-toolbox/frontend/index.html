<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 工具箱</title>
<link rel="stylesheet" href="../common.css">
<style>
/* ===== 容器 / 标签栏 ===== */
.jt-app{display:flex;flex-direction:column;height:100vh;font-family:var(--font-ui,system-ui,sans-serif)}
.jt-tabs{display:flex;gap:4px;padding:6px 10px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0}
.jt-tab{height:30px;padding:0 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-primary);font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.jt-tab:hover{background:var(--bg-hover)}
.jt-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.jt-pane{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.jt-pane[hidden]{display:none}

/* ===== JSON 编辑器（je- 前缀，复用 json-editor）===== */
.je-app{display:flex;flex-direction:column;height:100%;font-size:13px}
.je-toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.je-check{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary);cursor:pointer;user-select:none;white-space:nowrap}
.je-check input{accent-color:var(--accent)}
.je-body{display:flex;flex:1;min-height:0}
.je-pane-editor{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;min-height:0}
.je-editor{position:relative;display:flex;flex:1;min-height:0;overflow:auto;background:var(--bg-primary);font-family:var(--font-mono);font-size:13px}
.je-gutter{flex:0 0 auto;position:sticky;left:0;z-index:1;background:var(--bg-secondary);border-right:1px solid var(--border);user-select:none;padding:4px 0;color:var(--text-muted)}
.je-gnum{height:20px;line-height:20px;display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:0 8px 0 6px}
.je-fold{flex:0 0 12px;width:12px;text-align:center;cursor:pointer;color:var(--text-muted);font-size:10px}
.je-fold:hover{color:var(--accent)}
.je-fold.folded{color:var(--accent)}
.je-fold-spacer{flex:0 0 12px;width:12px}
.je-ln{min-width:30px;text-align:right}
.je-code{flex:1 1 auto;padding:4px 8px;outline:none;min-width:0;white-space:pre}
.je-code>div{height:20px;line-height:20px;white-space:pre}
.je-code .je-line-error{background:rgba(226,75,74,.20);box-shadow:inset 2px 0 0 var(--danger)}
.je-hint{position:absolute;top:8px;left:56px;color:var(--text-muted);font-family:var(--font-mono);font-size:12px;pointer-events:none;line-height:1.6}
.je-hint[hidden]{display:none}
.je-error{color:var(--danger)}
.je-status .ok{color:var(--success)}
.je-status .bad{color:var(--danger)}

/* ===== JSON → TS / Go（j2t- 前缀，复用 json2ts）===== */
.p-btn-toggle{background:transparent;border-color:var(--border)}
.p-btn-toggle.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ===== 数据转换（dc- 前缀，复用 data-converter）===== */
.p-label{font-size:12px;color:var(--text-secondary);white-space:nowrap}
.p-swap-btn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);cursor:pointer;color:var(--text-muted);transition:background .1s,color .1s}
.p-swap-btn:hover{background:var(--bg-hover);color:var(--accent)}
.p-body{flex:1;display:flex;overflow:hidden;gap:1px;background:var(--border)}
.p-pane{flex:1;display:flex;flex-direction:column;background:var(--bg-primary);min-width:0}
.p-pane-header{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font-size:11px;color:var(--text-muted);background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0;text-transform:uppercase;letter-spacing:.5px}
.p-textarea{flex:1;resize:none;padding:10px;border:none;outline:none;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-mono);font-size:13px;line-height:1.5;tab-size:2}
.p-textarea:focus{background:var(--bg-tertiary)}
.p-textarea::placeholder{color:var(--text-placeholder)}
.p-textarea-input:focus{background:var(--bg-tertiary)}
.p-textarea-output{background:var(--bg-tertiary)}
.p-output{flex:1;overflow:auto;padding:10px;font-family:var(--font-mono);font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:var(--text-primary);background:var(--bg-tertiary)}
.p-empty{display:flex;align-items:center;justify-content:center;flex:1;color:var(--text-muted);font-size:13px}
.p-stats{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:11px;color:var(--text-muted);background:var(--bg-secondary);border-top:1px solid var(--border);flex-shrink:0;min-height:24px}
.p-error{display:flex;align-items:center;gap:6px;padding:8px 10px;color:#e24b4a;font-size:12px;background:rgba(226,75,74,0.08);border-top:1px solid var(--border);flex-shrink:0}
</style>
</head>
<body>
<div class="jt-app">
  <div class="jt-tabs">
    <button class="jt-tab active" data-tab="editor" id="jtTabEditor">📝 JSON 编辑器</button>
    <button class="jt-tab" data-tab="tsgo" id="jtTabTsgo">🧬 JSON → TS / Go</button>
    <button class="jt-tab" data-tab="converter" id="jtTabConverter">🔄 数据格式转换</button>
  </div>

  <!-- ===== 面板 1：JSON 编辑器 ===== -->
  <div class="jt-pane" id="jtPaneEditor">
    <div class="je-app">
      <div class="je-toolbar">
        <button class="p-btn p-btn-primary" id="jeBtnFormat">美化</button>
        <button class="p-btn" id="jeBtnMinify">压缩</button>
        <div class="p-btn-group">
          <button class="p-btn p-btn-sm indent-btn active" data-indent="2">2空格</button>
          <button class="p-btn p-btn-sm indent-btn" data-indent="4">4空格</button>
        </div>
        <label class="je-check"><input type="checkbox" id="jeChkSort"> 排序键</label>
        <span class="p-sep"></span>
        <button class="p-btn" id="jeBtnCollapse">折叠全部</button>
        <button class="p-btn" id="jeBtnExpand">展开全部</button>
        <span class="p-spacer"></span>
        <button class="p-btn" id="jeBtnOpen">打开文件</button>
        <button class="p-btn" id="jeBtnCopy">复制</button>
        <button class="p-btn" id="jeBtnDownload">下载</button>
        <input type="file" id="jeFileInput" accept=".json,application/json,application/jsonlines" hidden>
      </div>
      <div class="je-body">
        <div class="je-pane-editor">
          <div class="p-pane-header">
            <span>编辑器（行号可折叠）</span>
            <span class="p-muted" id="jeEditorMeta"></span>
          </div>
          <div class="je-editor" id="jeEditor">
            <div class="je-gutter" id="jeGutter"></div>
            <div class="je-code" id="jeCode" contenteditable="true" spellcheck="false"></div>
            <div class="je-hint" id="jeHint">在此粘贴 JSON（自动美化），或点击右上角“打开文件”…<br>{ "name": "QuickDock", "features": ["format", "edit", "fold"] }</div>
          </div>
        </div>
      </div>
      <div class="p-statusbar je-status" id="jeStatusBar">
        <span id="jeStatusText">等待输入…</span>
      </div>
      <div class="p-error je-error" id="jeErrorBar" hidden></div>
    </div>
  </div>

  <!-- ===== 面板 2：JSON → TS / Go ===== -->
  <div class="jt-pane" id="jtPaneTsgo" hidden>
    <div class="p-app" style="display:flex;flex-direction:column;height:100%">
      <div class="p-toolbar">
        <button class="p-btn p-btn-primary" id="j2tBtnConvert">▶ 转换</button>
        <div class="p-btn-group">
          <button class="p-btn p-btn-toggle active" id="j2tBtnTs" data-type="typescript">TypeScript</button>
          <button class="p-btn p-btn-toggle" id="j2tBtnGo" data-type="go">Go Struct</button>
        </div>
        <span class="p-spacer"></span>
        <button class="p-btn" id="j2tBtnCopy">📋 复制</button>
        <button class="p-btn" id="j2tBtnClear">✕ 清空</button>
      </div>
      <div class="p-body">
        <div class="p-pane">
          <div class="p-pane-header">JSON 输入</div>
          <textarea id="j2tInput" class="p-textarea p-textarea-input" placeholder='{"name": "张三", "age": 25, "tags": ["dev"]}' spellcheck="false"></textarea>
        </div>
        <div class="p-pane">
          <div class="p-pane-header" id="j2tOutputLabel">TypeScript 输出</div>
          <textarea id="j2tOutput" class="p-textarea p-textarea-output" readonly placeholder="转换结果会显示在这里…" spellcheck="false"></textarea>
        </div>
      </div>
      <div class="p-statusbar" id="j2tStatusBar">
        <span id="j2tStatusText">等待输入…</span>
      </div>
    </div>
  </div>

  <!-- ===== 面板 3：数据格式转换 ===== -->
  <div class="jt-pane" id="jtPaneConverter" hidden>
    <div class="p-app" style="display:flex;flex-direction:column;height:100%">
      <div class="p-toolbar">
        <span class="p-label">输入格式</span>
        <select id="dcFrom" class="p-select">
          <option value="json">JSON</option>
          <option value="yaml">YAML</option>
          <option value="toml">TOML</option>
          <option value="xml">XML</option>
        </select>
        <button class="p-swap-btn" id="dcBtnSwap" title="交换格式">↔</button>
        <span class="p-label">输出格式</span>
        <select id="dcTo" class="p-select">
          <option value="yaml">YAML</option>
          <option value="json">JSON</option>
          <option value="toml">TOML</option>
          <option value="xml">XML</option>
        </select>
        <button class="p-btn p-btn-primary" id="dcBtnConvert">转换</button>
        <button class="p-btn" id="dcBtnCopy">复制</button>
        <button class="p-btn" id="dcBtnClear">清空</button>
      </div>
      <div class="p-body">
        <div class="p-pane">
          <div class="p-pane-header"><span id="dcInputLabel">输入</span></div>
          <textarea id="dcInput" class="p-textarea" placeholder="粘贴数据..." spellcheck="false"></textarea>
        </div>
        <div class="p-pane">
          <div class="p-pane-header"><span id="dcOutputLabel">输出</span></div>
          <pre id="dcOutput" class="p-output"><div class="p-empty">等待转换...</div></pre>
        </div>
      </div>
      <div id="dcStatusBar" class="p-stats"></div>
      <div id="dcErrorBar" class="p-error" style="display:none"></div>
    </div>
  </div>
</div>

<!-- ===== 共享桥接 + 标签路由（先于各面板脚本）===== -->
<script>
(function () {
  'use strict'
  var jtSeq = 0
  var jtPending = {}
  window.jtInitHandlers = {}

  // 标签切换
  var tabMap = { editor: 'jtPaneEditor', tsgo: 'jtPaneTsgo', converter: 'jtPaneConverter' }
  var tabBtnMap = { editor: 'jtTabEditor', tsgo: 'jtTabTsgo', converter: 'jtTabConverter' }
  function jtShowTab(name) {
    Object.keys(tabMap).forEach(function (k) {
      var pane = document.getElementById(tabMap[k])
      var btn = document.getElementById(tabBtnMap[k])
      if (!pane || !btn) return
      var on = (k === name)
      pane.hidden = !on
      btn.classList.toggle('active', on)
    })
  }
  window.jtShowTab = jtShowTab

  // 执行（→ 后端 goja）
  function jtExec(command, input) {
    return new Promise(function (resolve, reject) {
      var id = 'jt_exec_' + (++jtSeq)
      jtPending[id] = { res: resolve, rej: reject }
      parent.postMessage({ type: 'plugin:execute', id: id, command: command, input: input }, '*')
    })
  }
  window.jtExec = jtExec

  // 复制（→ 宿主 Go CopyText，WebView2 可靠）
  function jtFallbackCopy(text) {
    return new Promise(function (resolve) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { resolve(true) }).catch(function () { resolve(jtExecCopy(text)) })
          return
        }
      } catch (e) {}
      resolve(jtExecCopy(text))
    })
  }
  function jtExecCopy(text) {
    try {
      var ta = document.createElement('textarea')
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.top = '0'
      document.body.appendChild(ta); ta.select()
      var ok = document.execCommand('copy')
      document.body.removeChild(ta)
      return ok
    } catch (e) { return false }
  }
  function jtCopy(text) {
    return new Promise(function (resolve) {
      var id = 'jt_copy_' + (++jtSeq)
      var done = false
      function onMsg(e) {
        var d = e && e.data
        if (!d || d.type !== 'plugin:copy-result' || d.id !== id) return
        done = true
        window.removeEventListener('message', onMsg)
        resolve(!!d.ok)
      }
      window.addEventListener('message', onMsg)
      parent.postMessage({ type: 'plugin:copy', id: id, text: text }, '*')
      setTimeout(function () {
        if (!done) { window.removeEventListener('message', onMsg); resolve(jtFallbackCopy(text)) }
      }, 300)
    })
  }
  window.jtCopy = jtCopy

  // 统一消息分发：plugin:result / plugin:theme / plugin:init
  var cmdToTab = { 'json-format': 'editor', 'json-to-ts': 'tsgo', 'json-to-go': 'tsgo', 'convert-data': 'converter' }
  function routeInit(pd) {
    var tab = cmdToTab[pd.command] || null
    if (tab) jtShowTab(tab)
    if (tab && window.jtInitHandlers[tab]) window.jtInitHandlers[tab](pd)
  }
  window.addEventListener('message', function (e) {
    var d = e && e.data
    if (!d || !d.type) return
    if (d.type === 'plugin:result' && d.id) {
      var p = jtPending[d.id]
      if (!p) return
      delete jtPending[d.id]
      if (d.error) p.rej(new Error(d.error))
      else p.res(d.data)
    } else if (d.type === 'plugin:theme' && d.data && d.data.theme) {
      document.documentElement.setAttribute('data-theme', d.data.theme)
    } else if (d.type === 'plugin:init' && d.data) {
      routeInit(d.data)
    }
  })

  // 标签点击
  document.getElementById('jtTabEditor').addEventListener('click', function () { jtShowTab('editor') })
  document.getElementById('jtTabTsgo').addEventListener('click', function () { jtShowTab('tsgo') })
  document.getElementById('jtTabConverter').addEventListener('click', function () { jtShowTab('converter') })
  jtShowTab('editor')
})()
</script>

<!-- ===== 面板 1：JSON 编辑器逻辑（复用 json-editor/app.js）===== -->
<script>
(function () {
  'use strict'
  var jeGutter = document.getElementById('jeGutter')
  var jeCode = document.getElementById('jeCode')
  var jeHint = document.getElementById('jeHint')
  var jeStatusText = document.getElementById('jeStatusText')
  var jeErrorBar = document.getElementById('jeErrorBar')
  var jeEditorMeta = document.getElementById('jeEditorMeta')
  var jeFileInput = document.getElementById('jeFileInput')

  var state = { parsed: null, error: null, indent: 2, sortKeys: false, text: '', foldRanges: [], folded: new Set() }

  function setStatus(msg, cls) { jeStatusText.textContent = msg; jeStatusText.className = cls || '' }
  function clearErrorLines() {
    var els = jeCode.querySelectorAll('.je-line-error')
    for (var i = 0; i < els.length; i++) els[i].classList.remove('je-line-error')
  }
  function showError(err) {
    var pos = parseErrorPosition(err.message), where = ''
    clearErrorLines()
    if (pos >= 0) {
      var lc = offsetToLineCol(readText(), pos)
      where = '（第 ' + lc.line + ' 行，第 ' + lc.col + ' 列）'
      var els = lineEls(), d = els[lc.line - 1]
      if (d) { d.classList.add('je-line-error'); try { d.scrollIntoView({ block: 'center' }) } catch (e) {} }
    }
    jeErrorBar.hidden = false
    jeErrorBar.textContent = '解析错误：' + err.message + ' ' + where
  }
  function hideError() { jeErrorBar.hidden = true; clearErrorLines() }
  function parseErrorPosition(msg) { if (!msg) return -1; var m = /position (\d+)/.exec(msg); return m ? parseInt(m[1], 10) : -1 }
  function offsetToLineCol(text, offset) { var line = 1, col = 1; for (var i = 0; i < offset && i < text.length; i++) { if (text[i] === '\n') { line++; col = 1 } else col++ } return { line: line, col: col } }
  function lineEls() { var out = [], kids = jeCode.children; for (var i = 0; i < kids.length; i++) if (kids[i].nodeType === 1) out.push(kids[i]); return out }
  function readText() {
    var hidden = [], els = lineEls()
    for (var i = 0; i < els.length; i++) { if (els[i].style.display === 'none') { hidden.push(els[i]); els[i].style.display = '' } }
    var t = jeCode.innerText || ''
    for (var j = 0; j < hidden.length; j++) hidden[j].style.display = 'none'
    return t.replace(/\r\n/g, '\n')
  }
  function parseNow() {
    var text = readText(); state.text = text
    if (!text.trim()) { state.parsed = null; state.error = null; hideError(); setStatus('等待输入…'); jeEditorMeta.textContent = ''; jeHint.hidden = false; return false }
    jeHint.hidden = true
    try {
      var parsed = JSON.parse(text); state.parsed = parsed; state.error = null; hideError()
      setStatus('✓ 有效 JSON · ' + formatBytes(text.length), 'ok'); jeEditorMeta.textContent = ''; return true
    } catch (e) { state.error = e.message; showError(e); setStatus('✗ 解析失败', 'bad'); return false }
  }
  function computeFoldRanges(text) {
    var ranges = [], stack = [], line = 1, i = 0, n = text.length, inStr = false, strCh = '', escaped = false
    while (i < n) {
      var c = text[i]
      if (inStr) { if (escaped) escaped = false; else if (c === '\\') escaped = true; else if (c === strCh) inStr = false }
      else { if (c === '"' || c === "'") { inStr = true; strCh = c } else if (c === '{' || c === '[') { stack.push({ startLine: line, kind: c === '{' ? 'object' : 'array' }) } else if (c === '}' || c === ']') { if (stack.length) { var top = stack.pop(); ranges.push({ startLine: top.startLine, endLine: line, kind: top.kind }) } } else if (c === '\n') line++ }
      i++
    }
    return ranges
  }
  function findRange(startLine) { for (var i = 0; i < state.foldRanges.length; i++) if (state.foldRanges[i].startLine === startLine) return state.foldRanges[i]; return null }
  function renderEditor(text) {
    state.text = text; state.foldRanges = computeFoldRanges(text)
    var starts = {}; for (var s = 0; s < state.foldRanges.length; s++) starts[state.foldRanges[s].startLine] = true
    state.folded.forEach(function (ln) { if (!starts[ln]) state.folded.delete(ln) })
    var lines = text.split('\n'); jeCode.innerHTML = ''
    var frag = document.createDocumentFragment()
    for (var i = 0; i < lines.length; i++) { var d = document.createElement('div'); d.className = 'je-line'; d.textContent = lines[i]; frag.appendChild(d) }
    jeCode.appendChild(frag); renderGutter(); applyFold()
  }
  function renderGutter() {
    jeGutter.innerHTML = ''; var count = lineEls().length, starts = {}
    for (var s = 0; s < state.foldRanges.length; s++) starts[state.foldRanges[s].startLine] = state.foldRanges[s]
    var frag = document.createDocumentFragment()
    for (var i = 1; i <= count; i++) {
      var cell = document.createElement('div'); cell.className = 'je-gnum'
      if (starts[i]) {
        var tog = document.createElement('span'); tog.className = 'je-fold' + (state.folded.has(i) ? ' folded' : ''); tog.textContent = state.folded.has(i) ? '▸' : '▾'; tog.setAttribute('data-start', i); cell.appendChild(tog)
      } else { var sp = document.createElement('span'); sp.className = 'je-fold-spacer'; cell.appendChild(sp) }
      var num = document.createElement('span'); num.className = 'je-ln'; num.textContent = i; cell.appendChild(num); frag.appendChild(cell)
    }
    jeGutter.appendChild(frag)
  }
  function applyFold() {
    var els = lineEls(); for (var i = 0; i < els.length; i++) els[i].style.display = ''
    state.folded.forEach(function (start) { var r = findRange(start); if (!r) return; for (var ln = start + 1; ln <= r.endLine; ln++) { var el = els[ln - 1]; if (el) el.style.display = 'none' } })
  }
  function toggleFold(start) { if (state.folded.has(start)) state.folded.delete(start); else state.folded.add(start); renderGutter(); applyFold() }
  function syncView() {
    var text = readText(); state.text = text; state.foldRanges = computeFoldRanges(text)
    var starts = {}; for (var s = 0; s < state.foldRanges.length; s++) starts[state.foldRanges[s].startLine] = true
    state.folded.forEach(function (ln) { if (!starts[ln]) state.folded.delete(ln) })
    renderGutter(); applyFold(); parseNow()
  }
  function sortedStringify(value, indent) {
    if (!state.sortKeys) return JSON.stringify(value, null, indent)
    function sortify(v) {
      if (Array.isArray(v)) return v.map(sortify)
      if (v && typeof v === 'object') { var out = {}; Object.keys(v).sort().forEach(function (k) { out[k] = sortify(v[k]) }); return out }
      return v
    }
    return JSON.stringify(sortify(value), null, indent)
  }
  function tryFormat(text) {
    var t = (text || '').trim()
    if (t[0] !== '{' && t[0] !== '[') return null
    try { return sortedStringify(JSON.parse(text), state.indent) } catch (e) { return null }
  }
  function doFormat() { if (!parseNow()) return; renderEditor(sortedStringify(state.parsed, state.indent)); parseNow(); flashStatus('已美化（' + state.indent + ' 空格）') }
  function doMinify() { if (!parseNow()) return; renderEditor(JSON.stringify(state.parsed)); parseNow(); flashStatus('已压缩为一行') }
  function setAllCollapsed(collapsed) {
    if (collapsed) { for (var i = 0; i < state.foldRanges.length; i++) state.folded.add(state.foldRanges[i].startLine) } else { state.folded.clear() }
    renderGutter(); applyFold()
  }
  function openFile() { jeFileInput.click() }
  jeFileInput.addEventListener('change', function () {
    var f = jeFileInput.files && jeFileInput.files[0]; if (!f) return
    var reader = new FileReader()
    reader.onload = function () { var text = String(reader.result || ''); var fmt = tryFormat(text); renderEditor(fmt != null ? fmt : text); parseNow(); flashStatus('已打开：' + f.name + '（' + formatBytes(f.size) + '）') }
    reader.onerror = function () { flashStatus('文件读取失败', 'bad') }
    reader.readAsText(f); jeFileInput.value = ''
  })
  function currentText() { if (state.parsed !== null && !state.error) return sortedStringify(state.parsed, state.indent); return readText() }
  function doCopy() { window.jtCopy(currentText()).then(function (ok) { flashStatus(ok ? '已复制到剪贴板' : '复制失败', ok ? 'ok' : 'bad') }) }
  function doDownload() {
    var text = currentText(); var blob = new Blob([text], { type: 'application/json' })
    try {
      var url = URL.createObjectURL(blob); var a = document.createElement('a'); a.href = url; a.download = 'quickdock-' + Date.now() + '.json'
      document.body.appendChild(a); a.click(); document.body.removeChild(a)
      setTimeout(function () { URL.revokeObjectURL(url) }, 1000); flashStatus('已下载文件')
    } catch (e) { window.jtCopy(text).then(function () { flashStatus('下载被拦截，已改为复制到剪贴板') }) }
  }
  function formatBytes(b) { if (b < 1024) return b + ' B'; if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB'; return (b / 1024 / 1024).toFixed(1) + ' MB' }
  var flashTimer = null
  function flashStatus(msg, cls) {
    setStatus(msg, cls || 'ok')
    if (flashTimer) clearTimeout(flashTimer)
    flashTimer = setTimeout(function () {
      if (state.error) setStatus('✗ 解析失败', 'bad')
      else if (state.parsed) setStatus('✓ 有效 JSON · ' + formatBytes(readText().length), 'ok')
      else setStatus('等待输入…')
    }, 1500)
  }

  document.getElementById('jeBtnFormat').addEventListener('click', doFormat)
  document.getElementById('jeBtnMinify').addEventListener('click', doMinify)
  document.getElementById('jeBtnCollapse').addEventListener('click', function () { setAllCollapsed(true) })
  document.getElementById('jeBtnExpand').addEventListener('click', function () { setAllCollapsed(false) })
  document.getElementById('jeBtnOpen').addEventListener('click', openFile)
  document.getElementById('jeBtnCopy').addEventListener('click', doCopy)
  document.getElementById('jeBtnDownload').addEventListener('click', doDownload)
  var indentBtns = document.querySelectorAll('.indent-btn')
  indentBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      indentBtns.forEach(function (b) { b.classList.remove('active') }); btn.classList.add('active')
      state.indent = parseInt(btn.getAttribute('data-indent'), 10)
      if (state.parsed && !state.error) { renderEditor(sortedStringify(state.parsed, state.indent)); parseNow() }
    })
  })
  document.getElementById('jeChkSort').addEventListener('change', function (e) {
    state.sortKeys = e.target.checked
    if (state.parsed && !state.error) { renderEditor(sortedStringify(state.parsed, state.indent)); parseNow() }
  })
  var editTimer = null, composing = false
  jeCode.addEventListener('compositionstart', function () { composing = true })
  jeCode.addEventListener('compositionend', function () { composing = false; scheduleEdit() })
  jeCode.addEventListener('input', scheduleEdit)
  function scheduleEdit() { if (composing) return; if (editTimer) clearTimeout(editTimer); editTimer = setTimeout(syncView, 150) }
  jeCode.addEventListener('paste', function (e) {
    e.preventDefault()
    var text = (e.clipboardData || window.clipboardData).getData('text/plain'); if (!text) return
    var f = tryFormat(text)
    if (f != null) { renderEditor(f); parseNow(); flashStatus('已粘贴并美化') }
    else { document.execCommand('insertText', false, text) }
  })
  jeCode.addEventListener('keydown', function (e) { if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  ') } })
  jeGutter.addEventListener('click', function (e) { var t = e.target; if (t && t.classList && t.classList.contains('je-fold')) toggleFold(parseInt(t.getAttribute('data-start'), 10)) })

  // 命令面板带参打开（plugin:init）时填入并美化
  window.jtInitHandlers.editor = function (pd) {
    var text = pd && pd.text ? pd.text : ''
    if (text) { var f = tryFormat(text); renderEditor(f != null ? f : text); parseNow() }
    else { renderEditor(''); setStatus('等待输入…') }
  }

  renderEditor(''); setStatus('等待输入…')
})()
</script>

<!-- ===== 面板 2：JSON → TS / Go 逻辑（复用 json2ts/app.js，本地生成）===== -->
<script>
(function () {
  'use strict'
  var j2tInput = document.getElementById('j2tInput')
  var j2tOutput = document.getElementById('j2tOutput')
  var j2tOutputLabel = document.getElementById('j2tOutputLabel')
  var j2tBtnConvert = document.getElementById('j2tBtnConvert')
  var j2tBtnTs = document.getElementById('j2tBtnTs')
  var j2tBtnGo = document.getElementById('j2tBtnGo')
  var j2tBtnCopy = document.getElementById('j2tBtnCopy')
  var j2tBtnClear = document.getElementById('j2tBtnClear')
  var j2tStatusText = document.getElementById('j2tStatusText')
  var currentType = 'typescript'

  j2tBtnTs.addEventListener('click', function () { setType('typescript') })
  j2tBtnGo.addEventListener('click', function () { setType('go') })
  function setType(type) {
    currentType = type
    j2tBtnTs.classList.toggle('active', type === 'typescript')
    j2tBtnGo.classList.toggle('active', type === 'go')
    j2tOutputLabel.textContent = type === 'typescript' ? 'TypeScript 输出' : 'Go Struct 输出'
    if (j2tInput.value.trim()) doConvert()
  }
  document.addEventListener('keydown', function (e) { if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); doConvert() } })
  var autoTimer
  j2tInput.addEventListener('input', function () {
    if (autoTimer) clearTimeout(autoTimer)
    if (j2tInput.value.trim()) autoTimer = setTimeout(doConvert, 500)
    else { j2tOutput.value = ''; j2tStatusText.textContent = '等待输入…' }
  })
  j2tBtnConvert.addEventListener('click', doConvert)
  j2tBtnCopy.addEventListener('click', function () { if (j2tOutput.value) window.jtCopy(j2tOutput.value).then(function (ok) { j2tStatusText.textContent = ok ? '已复制！' : '复制失败' }) })
  j2tBtnClear.addEventListener('click', function () { j2tInput.value = ''; j2tOutput.value = ''; j2tStatusText.textContent = '等待输入…'; j2tInput.focus() })

  function doConvert() {
    var text = j2tInput.value.trim()
    if (!text) { j2tOutput.value = ''; j2tStatusText.textContent = '等待输入…'; return }
    try { JSON.parse(text) } catch (e) { j2tOutput.value = ''; j2tStatusText.textContent = 'JSON 解析失败: ' + e.message; return }
    var parsed = JSON.parse(text), result
    if (currentType === 'go') result = jsonToGo(parsed, 'Root'); else result = jsonToTypeScript(parsed, 'RootType')
    j2tOutput.value = result
    j2tStatusText.textContent = '✅ 转换成功 | ' + result.length + ' 字符'
  }

  function jsonToTypeScript(obj, name) {
    if (obj === null || obj === undefined) return 'type ' + name + ' = any\n'
    var type = typeof obj
    if (type === 'string') return 'type ' + name + ' = string\n'
    if (type === 'number') return 'type ' + name + ' = number\n'
    if (type === 'boolean') return 'type ' + name + ' = boolean\n'
    if (Array.isArray(obj)) return tsArrayToType(obj, name)
    if (type === 'object') return tsObjectToInterface(obj, name)
    return 'type ' + name + ' = any\n'
  }
  function tsArrayToType(arr, name) {
    if (arr.length === 0) return 'type ' + name + ' = any[]\n'
    var itemTypes = [], seen = {}
    for (var i = 0; i < arr.length; i++) {
      var item = arr[i], t = item === null ? 'null' : Array.isArray(item) ? 'array' : typeof item
      var key = t + '_' + JSON.stringify(item).substring(0, 50)
      if (!seen[key]) { seen[key] = true; itemTypes.push({ type: t, value: item }) }
    }
    if (itemTypes.length === 1) {
      var st = itemTypes[0]
      if (st.type === 'string') return 'type ' + name + ' = string[]\n'
      if (st.type === 'number') return 'type ' + name + ' = number[]\n'
      if (st.type === 'boolean') return 'type ' + name + ' = boolean[]\n'
      if (st.type === 'null') return 'type ' + name + ' = null[]\n'
      if (st.type === 'array') return 'type ' + name + ' = ' + tsArrayItemRef(st.value, name + 'Item') + '[][]\n'
      if (st.type === 'object') { var iname = name.charAt(0).toUpperCase() + name.slice(1); return tsObjectToInterface(st.value, iname) + '\nexport type ' + name + ' = ' + iname + '[]\n' }
    }
    var unionParts = []
    for (var j = 0; j < itemTypes.length; j++) {
      var it2 = itemTypes[j]
      if (it2.type === 'string') unionParts.push('string')
      else if (it2.type === 'number') unionParts.push('number')
      else if (it2.type === 'boolean') unionParts.push('boolean')
      else if (it2.type === 'null') unionParts.push('null')
      else if (it2.type === 'array') unionParts.push(tsArrayItemRef(it2.value, name + 'Item') + '[]')
      else if (it2.type === 'object') { var on2 = name.charAt(0).toUpperCase() + name.slice(1) + 'Item' + j; tsObjectToInterface(it2.value, on2); unionParts.push(on2) }
    }
    return 'export type ' + name + ' = (' + unionParts.join(' | ') + ')[]\n'
  }
  function tsArrayItemRef(item, baseName) { if (item === null || item === undefined) return 'any'; if (typeof item !== 'object') return typeof item; if (Array.isArray(item)) return 'any[]'; return baseName.charAt(0).toUpperCase() + baseName.slice(1) }
  function tsObjectToInterface(obj, name) {
    var keys = Object.keys(obj)
    if (keys.length === 0) return 'export interface ' + name + ' {}\n'
    var props = [], subInterfaces = []
    for (var i = 0; i < keys.length; i++) { var key = keys[i], val = obj[key]; var tsType = tsValueToTypeRef(val, name + cap(key), subInterfaces); props.push('  ' + key + ((val === null || val === undefined) ? '?' : '') + ': ' + tsType + ';') }
    var result = 'export interface ' + name + ' {\n' + props.join('\n') + '\n}\n'
    if (subInterfaces.length > 0) result = subInterfaces.join('\n') + '\n' + result
    return result
  }
  function tsValueToTypeRef(val, contextName, collector) {
    if (val === null || val === undefined) return 'any'
    var t = typeof val
    if (t === 'string') return 'string'
    if (t === 'number') return 'number'
    if (t === 'boolean') return 'boolean'
    if (Array.isArray(val)) { if (val.length === 0) return 'any[]'; var elemTypes = {}; for (var i = 0; i < val.length; i++) { var et = tsValueToTypeRef(val[i], contextName + 'Item', collector); elemTypes[et] = true } var tl = Object.keys(elemTypes); return tl.length === 1 ? tl[0] + '[]' : '(' + tl.join(' | ') + ')[]' }
    if (t === 'object') { collector.push(tsObjectToInterface(val, contextName)); return contextName }
    return 'any'
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1) }
  function jsonToGo(obj, name) {
    if (obj === null || obj === undefined) return 'type ' + name + ' interface{}\n'
    var type = typeof obj
    if (type === 'string') return 'type ' + name + ' string\n'
    if (type === 'number') return 'type ' + name + ' float64\n'
    if (type === 'boolean') return 'type ' + name + ' bool\n'
    if (Array.isArray(obj)) return goArrayToType(obj, name)
    if (type === 'object') return goObjectToStruct(obj, name)
    return 'type ' + name + ' interface{}\n'
  }
  function goArrayToType(arr, name) { if (arr.length === 0) return 'type ' + name + ' []interface{}\n'; var elemType = goUnifyElements(arr, name + 'Item'); return 'type ' + name + ' ' + elemType + '\n' }
  function goUnifyElements(arr, baseName) {
    var itemTypes = {}, seen = {}
    for (var i = 0; i < arr.length; i++) { var typeStr = goInferType(arr[i], baseName + 'Elem', seen); itemTypes[typeStr] = (itemTypes[typeStr] || 0) + 1 }
    var tl = Object.keys(itemTypes)
    if (tl.length === 1) return tl[0].indexOf('struct') >= 0 ? '[]' + tl[0] : '[]' + tl[0]
    return '[]interface{}'
  }
  function goInferType(val, contextName, seen) {
    if (val === null || val === undefined) return 'interface{}'
    var t = typeof val
    if (t === 'string') return 'string'
    if (t === 'number') { if (val === Math.floor(val) && isFinite(val) && Math.abs(val) < 2147483648) return 'int'; return 'float64' }
    if (t === 'boolean') return 'bool'
    if (Array.isArray(val)) { return val.length === 0 ? '[]interface{}' : goUnifyElements(val, contextName) }
    if (t === 'object') { if (seen[contextName]) return '*' + contextName; seen[contextName] = true; return goObjectToStruct(val, contextName) }
    return 'interface{}'
  }
  function goObjectToStruct(obj, name) {
    var keys = Object.keys(obj)
    if (keys.length === 0) return 'type ' + name + ' struct {}\n'
    var fields = [], seen = {}
    for (var i = 0; i < keys.length; i++) { var key = keys[i], val = obj[key]; var fn = key.split('_').map(function (s) { return s.charAt(0).toUpperCase() + s.slice(1) }).join(''); var gt = goInferType(val, name + fn, seen); if (val === null || val === undefined) gt = '*' + gt; fields.push('  ' + fn + ' ' + gt + ' `json:"' + key + '"`') }
    return 'type ' + name + ' struct {\n' + fields.join('\n') + '\n}\n'
  }

  // 命令面板带参打开：/ts 或 /go
  window.jtInitHandlers.tsgo = function (pd) {
    if (pd && pd.text) { j2tInput.value = pd.text; if (pd.command === 'json-to-go') setType('go'); else setType('typescript') }
  }

  j2tInput.focus()
})()
</script>

<!-- ===== 面板 3：数据格式转换逻辑（复用 data-converter，经后端 goja）===== -->
<script>
(function () {
  'use strict'
  function $(id) { return document.getElementById(id) }
  function detectFormat(text) {
    var t = text.trim()
    if (t.startsWith('{') || t.startsWith('[')) return 'json'
    if (t.startsWith('<')) return 'xml'
    if (t.indexOf(':') > 0 && t.indexOf('\n') > 0) return 'yaml'
    if (t.indexOf('=') > 0 && t.indexOf('\n') > 0 && t.indexOf('[') >= 0) return 'toml'
    return 'json'
  }
  function dcShowError(msg) { $('dcErrorBar').innerHTML = '⚠ ' + msg; $('dcErrorBar').style.display = 'flex' }
  function dcClearError() { $('dcErrorBar').style.display = 'none' }

  function dcConvert() {
    var input = $('dcInput').value, from = $('dcFrom').value, to = $('dcTo').value
    dcClearError()
    if (!input.trim()) { dcShowError('请输入待转换的数据'); return }
    $('dcInputLabel').textContent = '输入 (' + from.toUpperCase() + ')'
    $('dcOutputLabel').textContent = '输出 (' + to.toUpperCase() + ')'
    window.jtExec('convert-data', { text: input, fromFormat: from, toFormat: to }).then(function (res) {
      if (res && res.error) { dcShowError(res.error); return }
      var out = (res && (res.text !== undefined ? res.text : res.display)) || ''
      $('dcOutput').textContent = out
      var lines = out.split('\n').length
      $('dcStatusBar').textContent = lines + ' 行'
    }).catch(function (err) { dcShowError(err && err.message ? err.message : String(err)) })
  }
  function dcCopy() {
    var text = $('dcOutput').textContent
    if (text && text !== '等待转换...') window.jtCopy(text).then(function (ok) { $('dcStatusBar').textContent = ok ? '已复制！' : '复制失败' })
  }
  function dcSwap() { var f = $('dcFrom'), t = $('dcTo'), tmp = f.value; f.value = t.value; t.value = tmp }
  function dcClear() {
    $('dcInput').value = ''; $('dcOutput').innerHTML = '<div class="p-empty">等待转换...</div>'
    dcClearError(); $('dcStatusBar').textContent = ''
  }

  $('dcBtnConvert').addEventListener('click', dcConvert)
  $('dcBtnCopy').addEventListener('click', dcCopy)
  $('dcBtnSwap').addEventListener('click', dcSwap)
  $('dcBtnClear').addEventListener('click', dcClear)
  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') dcConvert() })

  // 命令面板带参打开：/convert {...}
  window.jtInitHandlers.converter = function (pd) {
    if (pd && pd.text) { $('dcInput').value = pd.text; dcConvert() }
  }
})()
</script>
