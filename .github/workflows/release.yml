name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # 全局版本号（= 触发工作流的 tag，去掉 v 前缀）。各 job 一致使用，避免"注入版本 ≠ manifest 版本"。
  VERSION: ''

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1) Windows：构建 exe + NSIS 安装器，产物上传为 artifact（不生成 manifest、不上传 Release）
  # ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 需要完整历史，才能生成"相对上个 tag 的更新说明"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Task runner
        # CI 构建统一走仓库 Taskfile（单一事实来源），避免构建参数在 CI 与 Taskfile 间漂移
        shell: pwsh
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Install Wails3 CLI
        # 版本从 go.mod 自动解析，与本地开发/构建严格一致
        shell: pwsh
        run: |
          $wailsVer = (Select-String -Path go.mod -Pattern 'wailsapp/wails/v3 ').Line.Trim().Split(' ')[1]
          Write-Host "Installing wails3 $wailsVer (resolved from go.mod)"
          go install github.com/wailsapp/wails/v3/cmd/wails3@$wailsVer
          echo "$(go env GOPATH)/bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Extract version from tag
        shell: pwsh
        run: |
          $ver = "$env:GITHUB_REF_NAME" -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "Building version: $ver"

      - name: 检查 tag 是否指向新提交
        # 同一 commit 上挂多个 tag 时 git describe 只返回其中一个（v0.4.3/v0.4.4 同 commit → 返回 v0.4.3），
        # 会导致 manifest 写 0.4.4 而 exe 里注入 0.4.3：更新后版本号不变、反复提示更新。
        # 这里只做告警：重跑同一 tag 的工作流、历史重置后首个提交打 tag 都是合法场景，
        # 真正的版本号正确性由下方「校验构建注入版本号与 tag 一致」步骤断言。
        #
        # 踩过的坑（勿回退）：
        #  1. 根提交没有父提交，`git describe "refs/tags/x^"` 报 bad revision 返回 128；
        #  2. GitHub 的 pwsh 包装默认 $ErrorActionPreference='Stop'，PS7 下原生命令非 0 退出
        #     会直接抛终止错误（PSNativeCommandUseErrorActionPreference）→ 整步 exit 1；
        #  3. 包装脚本末尾还会 `exit $LASTEXITCODE`，所以光捕获不够，必须显式把退出码归零。
        # 因此：步骤级 continue-on-error + 内部降级 Continue + 末尾显式 exit 0，三重保险。
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:\PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $global:LASTEXITCODE = 0

          # 用 --parents 取父提交列表，避免 "<ref>^" 在根提交上报 bad revision。
          # 输出格式：<自身sha> [<父sha> ...]
          $parts = @((git rev-list --parents -n 1 "$env:GITHUB_REF" 2>$null) -split '\s+' | Where-Object { $_ })
          if ($parts.Count -lt 2) {
            Write-Host "当前 tag $env:GITHUB_REF_NAME 位于根提交（无父提交），跳过同 commit 多 tag 检查。"
            exit 0
          }
          $cur = $parts[0]
          $prev = (git describe --tags --abbrev=0 $parts[1] 2>$null)
          if (-not $prev) {
            Write-Host "父提交 $($parts[1]) 之前没有历史 tag，跳过同 commit 多 tag 检查。"
            exit 0
          }
          $pre = (git rev-list -n 1 $prev 2>$null)
          if ($cur -and $pre -and ($cur -eq $pre)) {
            Write-Warning "当前 tag $env:GITHUB_REF_NAME 与上一个 tag $prev 指向同一提交($cur)：建议先提交新变更再打 tag"
          } else {
            Write-Host "tag $env:GITHUB_REF_NAME → $cur（上一个 tag $prev → $pre），无同 commit 叠 tag 问题"
          }
          $global:LASTEXITCODE = 0
          exit 0

      - name: 校验构建注入版本号与 tag 一致
        # 兜底断言：exe 内 main.appVersion 必须与 manifest version 相同，否则客户端会陷入
        # "检测到新版本→下载→替换→重启后版本没变→再检测到新版本" 的死循环。
        # 放在 Build 之前，不一致就直接中止，不浪费十来分钟构建时间。
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          $resolved = ((task -s windows:version) | Select-Object -Last 1).Trim() -replace '^v', ''
          Write-Host "Taskfile 解析版本=$resolved / tag 版本=$env:VERSION"
          if ($resolved -ne $env:VERSION) {
            throw "构建注入版本号($resolved) 与 tag($env:VERSION) 不一致，已中止发布，避免产出无法收敛的更新包"
          }

      - name: Build (via Taskfile)
        # 前端/后端/syso/图标均由 Taskfile 驱动；版本号由 APP_VERSION 显式传入（= 触发工作流的 tag），
        # 不再依赖 git describe（多 tag 同 commit 时会取错），保证与 manifest 的 $env:VERSION 同源。
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: task build

      - name: Generate WebView2 bootstrapper
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: wails3 generate webview2bootstrapper -dir build/windows/nsis

      - name: Package NSIS installer
        # NSIS 3.09 起默认安装目录从 "C:\Program Files (x86)\NSIS" 改为
        # "C:\Program Files\NSIS"，choco 拉新版时会装到 64 位路径，硬编码 (x86) 路径会导致 makensis.exe 找不到。
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Copy-Item bin/quickdock.exe build/windows/nsis/quickdock.exe
          $mk = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $mk) {
            foreach ($p in @("C:\Program Files\NSIS\makensis.exe", "C:\Program Files (x86)\NSIS\makensis.exe")) {
              if (Test-Path $p) { $mk = $p; break }
            }
          }
          if (-not $mk) { throw "makensis.exe not found. Install NSIS: choco install nsis -y" }
          Write-Host "Using makensis: $mk"
          # per-user 安装（user scope）：默认装到 $LOCALAPPDATA\Programs\QuickDock，
          # 免 UAC，且程序目录普通权限可写 —— 是后续"就地替换免安装器"更新的前提。
          & $mk '-DWAILS_INSTALL_SCOPE=user' '-DREQUEST_EXECUTION_LEVEL=user' '-DINFO_PROJECTNAME=quickdock' '-DARG_WAILS_AMD64_BINARY=quickdock.exe' 'build\windows\nsis\project.nsi'
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          Remove-Item build/windows/nsis/quickdock.exe

      - name: Stage portable raw binary
        # 便携裸 exe：既是手动分发的便携版，也是"就地替换更新"的 payload（manifest 签名的是此裸 exe）。
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Copy-Item bin/quickdock.exe bin/quickdock-amd64.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win
          path: |
            bin/quickdock-amd64-installer.exe
            bin/quickdock-amd64.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 2) macOS：matrix 双架构原生编译（arm64 → macos-15 / amd64 → macos-15-intel）
  #    产物：.dmg（首装）+ .app 的 .zip（就地替换更新的 payload），上传为 artifact
  # ─────────────────────────────────────────────────────────────
  build-macos:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Task runner
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails3 CLI
        run: |
          wailsVer=$(grep 'wailsapp/wails/v3 ' go.mod | head -1 | awk '{print $2}')
          echo "Installing wails3 $wailsVer (resolved from go.mod)"
          go install github.com/wailsapp/wails/v3/cmd/wails3@$wailsVer
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Extract version from tag
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "Building version: $ver (arch=${{ matrix.arch }})"

      - name: 校验构建注入版本号与 tag 一致
        # 与 Windows 同源：.app 内 CFBundleShortVersionString 必须与 manifest version 相同。
        working-directory: ${{ github.workspace }}
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          resolved=$(task -s darwin:version | tail -1 | sed 's/^v//')
          echo "Taskfile 解析版本=$resolved / tag 版本=$VERSION"
          [ "$resolved" = "$VERSION" ] || { echo "::error::构建注入版本号($resolved) 与 tag($VERSION) 不一致，已中止发布"; exit 1; }

      - name: Build + package .dmg + .zip (native, per-arch)
        # macos-15 / macos-15-intel 自带 Xcode CLT（含 macOS SDK），CGO_ENABLED=1 + GOOS=darwin 原生编译可行。
        # 走官方 DMG 链路：build → package(.app, ad-hoc 签名) → create:dmg。
        # 无 Developer ID 证书，.app 为 ad-hoc 签名，.dmg 仅本机/信任设备可用；正式分发需接
        # Developer ID 签名 + notarization（docs/mac-support-plan.md）。
        # 说明：当前 mac 首装需手动拖到 ~/Applications（详见 README）；就地替换更新链路已随 .zip 一并产出。
        working-directory: ${{ github.workspace }}
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          task darwin:package:dmg ARCH=${{ matrix.arch }}
          task darwin:package:zip ARCH=${{ matrix.arch }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            bin/quickdock-darwin-${{ matrix.arch }}.dmg
            bin/quickdock-darwin-${{ matrix.arch }}.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 3) publish-manifest：合并所有产物 → 生成签名 manifest.json → 上传到 Release
  # ─────────────────────────────────────────────────────────────
  publish-manifest:
    needs: [build-windows, build-macos]
    # ⚠️ 勿改回 ubuntu-latest：本 job 需要 wails3 CLI（`wails3 updater manifest` 签名生成 manifest.json），
    # 而 `go install .../cmd/wails3` 在 Linux 上会连带编译 internal/operatingsystem，
    # 该包用 cgo + pkg-config 依赖 gtk4 / webkitgtk-6.0：
    #   Package gtk4 was not found in the pkg-config search path → go install 直接 exit 1。
    # Windows/macOS runner 上 CLI 无此依赖，故这里选 windows-latest（比 mac runner 便宜、与 build-windows 同环境已验证）。
    # 若确要回到 ubuntu，必须先 `sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev`（多一步 apt，且依赖包名稳定性）。
    runs-on: windows-latest
    defaults:
      run:
        # 沿用 bash（Windows runner 自带 Git Bash），保持脚本与 mac job 写法一致
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # 注意：本 job 不需要 Task runner（不跑 Taskfile，只调用 wails3 updater manifest）

      - name: Install Wails3 CLI
        run: |
          set -euo pipefail
          wailsVer=$(grep 'wailsapp/wails/v3 ' go.mod | head -1 | awk '{print $2}')
          echo "Installing wails3 $wailsVer (resolved from go.mod)"
          go install github.com/wailsapp/wails/v3/cmd/wails3@$wailsVer
          # Windows runner + Git Bash：GITHUB_PATH 里的 "C:\...\go/bin" 混合分隔符转换不可靠，
          # 因此额外导出绝对路径 $WAILS3 供后续步骤直接调用（双保险，不依赖 PATH 是否生效）。
          # 注意两者路径风格不同：GITHUB_PATH 要 Windows 风格（runner 拼进系统 PATH），
          # $WAILS3 要 POSIX 风格（后续步骤都在 bash 里执行）。
          winGopath="$(go env GOPATH)"
          posixGopath="$winGopath"
          if command -v cygpath >/dev/null 2>&1; then posixGopath="$(cygpath -u "$winGopath")"; fi
          echo "${winGopath}\\bin" >> "$GITHUB_PATH"
          echo "WAILS3=$posixGopath/bin/wails3.exe" >> "$GITHUB_ENV"
          "$posixGopath/bin/wails3.exe" version || true

      - name: Extract version from tag
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          # merge-multiple 把所有 artifact 摊平到同一目录（文件名无冲突）
          path: dist
          merge-multiple: true

      - name: Generate signed updater manifest
        # 真正的安全机制：用 Ed25519 私钥对【更新 payload】签名，产出 manifest.json
        # （含 sha512 摘要 + ed25519ph 签名）。应用端 endpoint provider 拉取此文件验签
        # （fail closed：签名不符直接报错、不安装），再由 Wails updater helper 就地覆盖完成升级。
        # manifest 仅收录"更新 payload"（windows exe + 两个 mac .zip），dmg/安装器是首装用的，不进 manifest。
        # 架构识别由文件名驱动：quickdock-amd64.exe → windows/amd64；
        # quickdock-darwin-arm64.zip / quickdock-darwin-amd64.zip → darwin/{arm64,amd64}。
        # 必须设置仓库 Secret UPDATER_PRIVATE_KEY（私钥 PEM 全文），否则不生成 manifest、更新链路失效。
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATER_PRIVATE_KEY" ]; then
            echo "::error::UPDATER_PRIVATE_KEY secret 未设置，无法生成签名 manifest，更新链路将失效。"
            exit 1
          fi
          printf '%s' "$UPDATER_PRIVATE_KEY" > updater.key

          urlPrefix="https://github.com/parieses/quickdock/releases/download/${GITHUB_REF_NAME}"

          # 更新说明（写入文件，不参与签名）：取上一个 tag 到当前 tag 的提交主题。
          notesFile="release_notes.md"
          prev=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          if [ -n "$prev" ]; then
            git log "${prev}..HEAD" --pretty=format="- %s%n" > "$notesFile"
          else
            git log --pretty=format="- %s%n" -n 30 > "$notesFile"
          fi

          "${WAILS3:-wails3}" updater manifest \
            -version "$VERSION" \
            -key updater.key \
            -url-prefix "$urlPrefix" \
            -notes-file "$notesFile" \
            -output dist/manifest.json \
            dist/quickdock-amd64.exe \
            dist/quickdock-darwin-arm64.zip \
            dist/quickdock-darwin-amd64.zip

          rm -f updater.key "$notesFile"

      - name: Upload Release Assets
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/quickdock-amd64-installer.exe,dist/quickdock-amd64.exe,dist/quickdock-darwin-arm64.dmg,dist/quickdock-darwin-arm64.zip,dist/quickdock-darwin-amd64.dmg,dist/quickdock-darwin-amd64.zip,dist/manifest.json"
          generateReleaseNotes: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          artifactErrorsFailBuild: false
