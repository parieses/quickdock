name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Wails3 CLI
        # 锁定与 go.mod 一致的版本，避免 @latest 行为变化破坏 CI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.114

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Extract version from tag
        shell: pwsh
        run: |
          $ver = "$env:GITHUB_REF_NAME" -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "Building version: $ver"

      - name: Generate Wails bindings
        # frontend/bindings is gitignored (generated by the Wails CLI) and is
        # required by vue-tsc before `npm run build`. Without this step the
        # checkout has no bindings and the build fails with TS2307.
        # 参数与 Taskfile generate:bindings 保持一致（-ts -i -clean）
        shell: pwsh
        run: |
          go mod download
          wails3 generate bindings -ts -i -clean

      - name: Build frontend
        shell: pwsh
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Generate icon resource
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          wails3 generate syso -arch amd64 `
            -icon build/windows/icon.ico `
            -manifest build/windows/wails.exe.manifest `
            -info build/windows/info.json `
            -out wails_windows_amd64.syso

      - name: Generate WebView2 bootstrapper
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: wails3 generate webview2bootstrapper -dir build/windows/nsis

      - name: Build system-tools (native plugin binary)
        # system-tools.exe 被 go:embed 进产物且被 .gitignore 忽略，
        # 必须在 go build 之前构建，否则 hosts-manager/port-scanner/wifi-manager 三个内置插件失效。
        # 注意：tools/system-tools 是独立 Go module（自带 go.mod），必须 cd 进去构建，
        # 不能从仓库根用 ./tools/system-tools 路径（会被当成 quickdock 子包解析而失败）
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Set-Location tools/system-tools
          go build -trimpath -ldflags="-s -w" -o ../../plugins/builtin/_shared/system-tools.exe .

      - name: Build binary (production)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          go build -tags production `
            -trimpath -buildvcs=false `
            -ldflags="-w -s -H windowsgui -X main.appVersion=$env:VERSION" `
            -o bin/quickdock.exe .
          Remove-Item wails_windows_amd64.syso

      - name: Package NSIS installer
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Copy-Item bin/quickdock.exe build/windows/nsis/quickdock.exe
          & "C:\Program Files (x86)\NSIS\makensis.exe" '-DARG_WAILS_AMD64_BINARY=quickdock.exe' 'build\windows\nsis\project.nsi'
          Remove-Item build/windows/nsis/quickdock.exe

      - name: Generate updater manifest
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if ("${{ secrets.UPDATER_PRIVATE_KEY }}" -ne "") {
            Set-Content -Path updater.key -Value "${{ secrets.UPDATER_PRIVATE_KEY }}"
            $tag = "$env:GITHUB_REF_NAME"
            $urlPrefix = "https://github.com/parieses/quickdock/releases/download/$tag"
            wails3 updater manifest `
              -version "$env:VERSION" `
              -key updater.key `
              -url-prefix "$urlPrefix" `
              -output manifest.json `
              bin/quickdock-amd64-installer.exe
            Remove-Item updater.key -ErrorAction SilentlyContinue
          } else {
            echo "No UPDATER_PRIVATE_KEY secret set - skipping manifest signing"
          }

      - name: Upload Release Assets
        uses: ncipollo/release-action@v1
        with:
          artifacts: "bin/quickdock-amd64-installer.exe,manifest.json"
          generateReleaseNotes: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          artifactErrorsFailBuild: false
