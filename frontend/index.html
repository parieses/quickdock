<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>快启坞 · QuickDock</title>
    <!-- 首屏底色：main.ts 及其动态 import 下载/解析完成前，WebView2 会先画一帧
         默认白底；开启系统材质后窗口是 Translucent，chromium 背景被强制设成
         (0,0,0,0)，那一帧就变成透明窗口 + Acrylic —— 也就是浮窗「先闪一下空白」。
         内联样式让第一帧就是主题色，不依赖任何 JS/CSS 加载；Vue 挂载后由
         style.css 接管（.qd-backdrop 下再转透明把材质放出来）。
         主题存在后端需异步读取，这里只能按系统偏好兜底；手动选浅色但系统是深色
         的用户会先看到一瞬深底再切浅，仍远好过透明/白闪。 -->
    <style>
      html, body { margin: 0; height: 100%; background-color: #0c0e13; }
      @media (prefers-color-scheme: light) {
        html, body { background-color: #f6f7f9; }
      }
    </style>
    <script>
      // 主窗口刻意不拦 contextmenu。
      // 之前为关掉「独立窗口」的 WebView2 原生菜单，在所有入口页统一装了捕获监听，
      // 结果 dev 下主窗口连右键「检查」也没了 —— 而 Wails v3 在 debugMode 下本来就
      // 强制打开默认菜单（webview_window_windows.go: debugMode || !选项），
      // 那正是留给开发调试的通道，不该由页面脚本抹掉。
      // 正式包由 main.go 的 DefaultContextMenuDisabled 在窗口级关掉原生菜单；
      // 插件 / DSH 等独立窗口仍由 plugin.html 与插件桥脚本兜底（刷新会丢编辑状态）。
      // 保存的主题要等 GetValue('theme') 异步返回才由 App.vue 定稿。先按系统偏好
      // 同步落一个 data-theme，否则 style.css 一到就先套 :root 的深色变量，
      // 浅色系统用户会看到「浅 → 深 → 浅」两次跳变。
      try {
        document.documentElement.setAttribute('data-theme',
          window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- 启动遮罩：主窗口建窗时数据库还没打开，Go 侧不可能知道有没有设启动密码，
         所以第一帧一律先铺这层实色遮罩。App.vue 拿到 LockStatus 后把它淡出
         （已解锁）或直接由锁层接管（仍锁定）—— 两种情况都不会先闪出真实界面。
         浮窗（hash 非空）同样要铺：建窗时若处于锁定态，URL 会带 ?locked=1，
         而锁定期间解锁的事件可能在本窗口脚本就绪之前就广播完了（监听器还没注册），
         结果状态停在过期的 true 上，等 LockStatus 回来才纠正——那一瞬就是
         「浮窗先闪一下锁层再正常」。遮罩留到状态确认之后再撤即可根治。
         内联写死颜色，理由同 head 里的首屏底色：不能依赖任何外部 CSS。 -->
    <div id="qd-boot-mask" aria-hidden="true">
      <div class="qd-boot-spinner"></div>
    </div>
    <style>
      #qd-boot-mask {
        position: fixed;
        inset: 0;
        /* 必须高过锁层（30000）：首帧若先露出锁层、下一帧才被遮罩盖住，
           或者反过来，都会闪。压在锁层上面，状态确认后一次性撤掉就没有过渡痕迹。 */
        z-index: 30001;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0c0e13;
        transition: opacity 160ms ease;
      }
      #qd-boot-mask.qd-boot-mask-out { opacity: 0; }
      .qd-boot-spinner {
        width: 26px;
        height: 26px;
        border: 2px solid rgba(232, 236, 244, 0.16);
        border-top-color: #5b8cff;
        border-radius: 50%;
        animation: qd-boot-spin 720ms linear infinite;
      }
      @keyframes qd-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: light) {
        #qd-boot-mask { background: #f6f7f9; }
        .qd-boot-spinner {
          border-color: rgba(26, 31, 39, 0.14);
          border-top-color: #5b8cff;
        }
      }
    </style>
    <script>
      // 浮窗（hash 非空）只在「建窗那一刻就已锁定」时才需要留遮罩：
      // 那种窗口的 URL 带 ?locked=1，要先等 LockStatus 确认是否已被解锁，
      // 否则首帧会先画一帧锁层（详见 App.vue 的 syncLockOnShow）。
      //
      // 未锁态建窗的浮窗必须立刻撤掉：它没有任何状态需要确认，而遮罩要等
      // LockStatus 一次 IPC 往返、再走 160ms 淡出——正好是「按 Ctrl+` 先空一下
      // 才出内容」的那几百毫秒（浅色主题下遮罩接近白色，看起来就是「白一下」）。
      // 撤掉不会露馅：浮窗是懒创建 + 建完立刻 Hide，等到 Show 时内容早已渲染完成。
      if (location.hash && !/[?&]locked=1/.test(location.search)) {
        var bootMask = document.getElementById('qd-boot-mask')
        if (bootMask) bootMask.remove()
      }
    </script>
    <script src="./src/main.ts" type="module"></script>
  </body>
</html>
